<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SCNRO – PUCIT Smart Campus</title>
<!-- Anti-flash: runs synchronously before first paint -->
<script>
(function(){
  var t=localStorage.getItem('scnro_token'),u=localStorage.getItem('scnro_user');
  document.documentElement.className=t&&u?'authed':'guest';
})();
</script>
<style>
/* ── Reset ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f4f6f8;color:#222;min-height:100vh}

/* ── PUCIT colour palette ── */
:root{
  --g:#006633;      /* PUCIT green  */
  --gd:#004d26;     /* darker green */
  --gl:#e6f4ee;     /* light green  */
  --au:#C9A227;     /* gold accent  */
  --ald:#a07d15;
  --white:#fff;
  --grey:#f1f3f5;
  --border:#d1d5db;
  --text:#222;
  --muted:#6b7280;
  --danger:#dc2626;
  --info:#1d4ed8;
  --radius:8px;
  --shadow:0 2px 8px rgba(0,0,0,.12);
}

/* ── Anti-flash: hide wrong screen before JS fully loads ── */
html.guest   #screen-app    {display:none!important}
html.guest   #screen-signup {display:none!important}
html.authed  #screen-login  {display:none!important}
html.authed  #screen-signup {display:none!important}
html.signup  #screen-login  {display:none!important}
html.signup  #screen-app    {display:none!important}
html:not(.guest):not(.authed):not(.signup) #screen-login,
html:not(.guest):not(.authed):not(.signup) #screen-app,
html:not(.guest):not(.authed):not(.signup) #screen-signup{display:none!important}

/* ── Typography ── */
h2{font-size:1.3rem;font-weight:700;color:var(--g);margin-bottom:1rem}
h3{font-size:1.05rem;font-weight:600;color:var(--gd);margin-bottom:.6rem}

/* ── Auth screens ── */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--gd) 0%,var(--g) 60%,var(--au) 100%)}
.auth-card{background:var(--white);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.25);width:380px;overflow:hidden}
.auth-header{background:var(--g);color:var(--white);padding:1.4rem 1.6rem;display:flex;align-items:center;gap:.8rem}
.auth-header img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--au)}
.auth-header h1{font-size:1.15rem;font-weight:700;line-height:1.2}
.auth-header p{font-size:.75rem;opacity:.85}
.auth-body{padding:1.6rem}
.auth-body label{display:block;font-size:.82rem;font-weight:600;color:var(--gd);margin-bottom:.3rem;margin-top:.9rem}
.auth-body label:first-of-type{margin-top:0}
.auth-body input,.auth-body select{width:100%;padding:.55rem .75rem;border:1px solid var(--border);border-radius:var(--radius);font-size:.9rem;transition:border-color .2s}
.auth-body input:focus,.auth-body select:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px rgba(0,102,51,.15)}
.btn{display:inline-block;padding:.55rem 1.2rem;border:none;border-radius:var(--radius);font-size:.9rem;font-weight:600;cursor:pointer;transition:background .2s,opacity .2s}
.btn-primary{background:var(--g);color:var(--white)}
.btn-primary:hover{background:var(--gd)}
.btn-accent{background:var(--au);color:var(--white)}
.btn-accent:hover{background:var(--ald)}
.btn-danger{background:var(--danger);color:var(--white)}
.btn-danger:hover{opacity:.85}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{background:var(--grey)}
.btn-sm{padding:.3rem .75rem;font-size:.8rem}
.btn-full{width:100%;margin-top:1rem}
.auth-link{text-align:center;margin-top:.9rem;font-size:.83rem;color:var(--muted)}
.auth-link a{color:var(--g);font-weight:600;cursor:pointer;text-decoration:none}
.auth-link a:hover{text-decoration:underline}
.auth-msg{margin-top:.7rem;padding:.5rem .75rem;border-radius:var(--radius);font-size:.83rem;display:none}
.auth-msg.error{background:#fee2e2;color:#991b1b;display:block}
.auth-msg.success{background:#dcfce7;color:#166534;display:block}

/* ── App shell ── */
.app-shell{display:flex;height:100vh;overflow:hidden}

/* Sidebar */
.sidebar{width:220px;background:var(--g);color:var(--white);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-brand{padding:1rem 1.2rem;border-bottom:1px solid rgba(255,255,255,.15);display:flex;align-items:center;gap:.6rem}
.sidebar-brand .logo{width:36px;height:36px;background:var(--white);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--g);font-weight:700;font-size:.9rem;flex-shrink:0}
.sidebar-brand span{font-size:.85rem;font-weight:700;line-height:1.2}
.sidebar-user{padding:.8rem 1.2rem;border-bottom:1px solid rgba(255,255,255,.15);font-size:.78rem;opacity:.9}
.sidebar-user strong{display:block;font-size:.88rem}
.sidebar-user .role-badge{display:inline-block;margin-top:.2rem;background:var(--au);color:var(--white);font-size:.7rem;font-weight:700;padding:.1rem .4rem;border-radius:4px;text-transform:uppercase}
nav.sidebar-nav{flex:1;overflow-y:auto;padding:.5rem 0}
.nav-item{display:flex;align-items:center;gap:.6rem;padding:.62rem 1.2rem;cursor:pointer;font-size:.87rem;border-left:3px solid transparent;transition:background .15s,border-color .15s}
.nav-item:hover{background:rgba(255,255,255,.12)}
.nav-item.active{background:rgba(255,255,255,.18);border-left-color:var(--au);font-weight:600}
.nav-item .ico{font-size:1rem;width:18px;text-align:center}
.sidebar-footer{padding:.8rem 1.2rem;border-top:1px solid rgba(255,255,255,.15)}
.sidebar-footer .btn{background:rgba(255,255,255,.15);color:var(--white);border:1px solid rgba(255,255,255,.25);width:100%;font-size:.82rem}
.sidebar-footer .btn:hover{background:rgba(255,255,255,.25)}

/* Main content */
.main-content{flex:1;overflow-y:auto;padding:1.5rem;background:#f4f6f8}

/* ── Cards ── */
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.2rem;margin-bottom:1rem}
.card-title{font-size:1rem;font-weight:700;color:var(--gd);margin-bottom:.8rem;display:flex;align-items:center;gap:.4rem}

/* ── Stat grid ── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem;margin-bottom:1.2rem}
.stat-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:1rem;border-top:3px solid var(--g);text-align:center}
.stat-card .val{font-size:1.8rem;font-weight:700;color:var(--g)}
.stat-card .lbl{font-size:.78rem;color:var(--muted);margin-top:.2rem}

/* ── Table ── */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.87rem}
thead th{background:var(--g);color:var(--white);padding:.5rem .75rem;text-align:left;white-space:nowrap}
tbody tr:nth-child(even){background:var(--gl)}
tbody tr:hover{background:#d4edda}
tbody td{padding:.45rem .75rem;border-bottom:1px solid var(--border)}

/* ── Form ── */
.form-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.8rem;margin-bottom:.8rem}
.form-field{display:flex;flex-direction:column;gap:.3rem}
.form-field label{font-size:.8rem;font-weight:600;color:var(--gd)}
.form-field input,.form-field select,.form-field textarea{padding:.45rem .65rem;border:1px solid var(--border);border-radius:6px;font-size:.88rem;transition:border-color .2s}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px rgba(0,102,51,.12)}
.form-field textarea{resize:vertical;min-height:70px}
.form-actions{display:flex;gap:.6rem;margin-top:.8rem;flex-wrap:wrap}

/* ── Badge ── */
.badge{display:inline-block;padding:.15rem .5rem;border-radius:99px;font-size:.73rem;font-weight:600}
.badge-green{background:#dcfce7;color:#166534}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-orange{background:#ffedd5;color:#9a3412}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-grey{background:#f3f4f6;color:#374151}
.badge-gold{background:#fef9c3;color:#854d0e}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal-box{background:var(--white);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.2rem;border-bottom:1px solid var(--border)}
.modal-header h3{color:var(--gd)}
.modal-close{background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--muted);line-height:1}
.modal-close:hover{color:var(--danger)}
.modal-body{padding:1.2rem}
.modal-footer{padding:.8rem 1.2rem;border-top:1px solid var(--border);display:flex;gap:.6rem;justify-content:flex-end}

/* ── Room availability pills ── */
.avail-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.avail-dot.on{background:#22c55e}
.avail-dot.off{background:#ef4444}

/* ── Alert banner ── */
.alert{padding:.6rem .9rem;border-radius:var(--radius);font-size:.84rem;margin-bottom:.8rem}
.alert-info{background:#dbeafe;color:#1e40af}
.alert-warn{background:#fef9c3;color:#854d0e}
.alert-success{background:#dcfce7;color:#166534}
.alert-danger{background:#fee2e2;color:#991b1b}

/* ── Loader ── */
.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(0,102,51,.25);border-top-color:var(--g);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:4px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Tab bar (marks mgmt) ── */
.tab-bar{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:1rem;flex-wrap:wrap}
.tab-btn{padding:.5rem 1rem;border:none;background:none;cursor:pointer;font-size:.87rem;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;transition:color .15s,border-color .15s}
.tab-btn.active{color:var(--g);border-bottom-color:var(--g);font-weight:700}

/* ── My grades card per course ── */
.course-pill{display:inline-flex;align-items:center;gap:.4rem;background:var(--gl);border:1px solid var(--g);border-radius:6px;padding:.25rem .7rem;font-size:.82rem;color:var(--gd);font-weight:600;margin:.2rem}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════ LOGIN ══ -->
<div id="screen-login" class="auth-wrap">
  <div class="auth-card">
    <div class="auth-header">
      <div style="background:var(--au);width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0">🎓</div>
      <div><h1>SCNRO – PUCIT</h1><p>Smart Campus Navigation &amp; Resource Optimizer</p></div>
    </div>
    <div class="auth-body">
      <form id="login-form" onsubmit="doLogin(event)">
        <label for="li-email">University Email</label>
        <input id="li-email" type="email" placeholder="yourname@pucit.edu.pk" required autocomplete="username"/>
        <label for="li-pass">Password</label>
        <input id="li-pass" type="password" placeholder="••••••••" required autocomplete="current-password"/>
        <div id="login-msg" class="auth-msg"></div>
        <button type="submit" class="btn btn-primary btn-full" id="login-btn">Sign In</button>
      </form>
      <div class="auth-link">Don't have an account? <a onclick="showSignup()">Request Access</a></div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════ SIGNUP ══ -->
<div id="screen-signup" class="auth-wrap" style="display:none">
  <div class="auth-card">
    <div class="auth-header">
      <div style="background:var(--au);width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0">📋</div>
      <div><h1>Request Access</h1><p>Admin approval required before login</p></div>
    </div>
    <div class="auth-body">
      <label for="su-name">Full Name</label>
      <input id="su-name" type="text" placeholder="Your full name" required/>
      <label for="su-email">University Email</label>
      <input id="su-email" type="email" placeholder="yourname@pucit.edu.pk" required/>
      <label for="su-role">Role</label>
      <select id="su-role" onchange="updateSignupDeptVisibility()">
        <option value="student">Student</option>
        <option value="teacher">Teacher / Lecturer</option>
        <option value="sac">SAC Officer</option>
        <option value="head_clerk">Head Clerk</option>
        <option value="degree_coordinator">Degree Coordinator</option>
      </select>
      <label for="su-dept">Department</label>
      <select id="su-dept">
        <option value="">— Select Department —</option>
        <option value="IT">IT</option>
        <option value="CS">CS</option>
        <option value="SE">SE</option>
        <option value="DS">DS</option>
        <option value="AI">AI</option>
      </select>
      <label for="su-pass">Password</label>
      <input id="su-pass" type="password" placeholder="Min 6 characters" required/>
      <div id="signup-msg" class="auth-msg"></div>
      <button class="btn btn-accent btn-full" onclick="doSignup()">Submit Request</button>
      <div class="auth-link">Already have an account? <a onclick="showLogin()">Sign In</a></div>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════ APP ══ -->
<div id="screen-app" class="app-shell" style="display:none">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo">PU</div>
      <span>SCNRO<br/>PUCIT</span>
    </div>
    <div class="sidebar-user">
      <strong id="sb-name">—</strong>
      <span id="sb-email" style="font-size:.72rem;opacity:.8;display:block"></span>
      <span id="sb-role-badge" class="role-badge">—</span>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <button class="btn btn-sm" onclick="doLogout()">⇠ Sign Out</button>
    </div>
  </aside>

  <!-- Content panes -->
  <div class="main-content" id="main-content">
    <!-- Rendered by JS -->
  </div>
</div>

<!-- ═══════════════════════════════════════════ SHARED MODAL ══ -->
<div id="modal-overlay" class="modal-overlay" style="display:none">
  <div class="modal-box" id="modal-box">
    <div class="modal-header">
      <h3 id="modal-title">Modal</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════ STATE ══════════════════════════════ */
const API = '/api/v1';
let _token = localStorage.getItem('scnro_token') || '';
let _user  = (() => { try{ return JSON.parse(localStorage.getItem('scnro_user')||'null'); }catch(e){return null;} })();

/* ═══════════════════════════════ HELPERS ════════════════════════════ */
async function apiFetch(path, opts={}) {
  const headers = {'Content-Type':'application/json'};
  if (_token) headers['Authorization'] = 'Bearer ' + _token;
  const r = await fetch(API + path, { ...opts, headers });
  if (r.status === 401) { doLogout(); return null; }
  return r;
}
const $id = id => document.getElementById(id);
function showMsg(el, txt, type='error') {
  el.textContent = txt;
  el.className = 'auth-msg ' + type;
}
function openModal(title, bodyHtml, footerHtml='') {
  $id('modal-title').textContent = title;
  $id('modal-body').innerHTML = bodyHtml;
  $id('modal-footer').innerHTML = footerHtml;
  $id('modal-overlay').style.display = 'flex';
}
function closeModal() { $id('modal-overlay').style.display = 'none'; }
$id('modal-overlay').addEventListener('click', e => { if(e.target === $id('modal-overlay')) closeModal(); });

function fmtRole(r) {
  return {admin:'Admin',teacher:'Teacher',student:'Student',sac:'SAC Officer',
    head_clerk:'Head Clerk',degree_coordinator:'Degree Coordinator'}[r]||r;
}
function badge(txt, cls) { return `<span class="badge ${cls}">${txt}</span>`; }

/* ═══════════════════════════════ THEME ══════════════════════════════ */
const THEMES = {
  green: {g:'#006633',gd:'#004d26',gl:'#e6f4ee',au:'#C9A227',ald:'#a07d15',text:'#222',bg:'#f4f6f8'},
  blue:  {g:'#1d4ed8',gd:'#1e3a8a',gl:'#dbeafe',au:'#f59e0b',ald:'#d97706',text:'#1e293b',bg:'#f0f4ff'},
  dark:  {g:'#1f2937',gd:'#111827',gl:'#374151',au:'#f59e0b',ald:'#d97706',text:'#e5e7eb',bg:'#0f172a'},
  purple:{g:'#7c3aed',gd:'#5b21b6',gl:'#ede9fe',au:'#f59e0b',ald:'#d97706',text:'#1e1b4b',bg:'#faf5ff'},
  red:   {g:'#dc2626',gd:'#991b1b',gl:'#fee2e2',au:'#f59e0b',ald:'#d97706',text:'#1c1917',bg:'#fff5f5'},
};
const FONTS = {
  segoe:  "'Segoe UI', Arial, sans-serif",
  roboto: "'Roboto', 'Segoe UI', sans-serif",
  inter:  "'Inter', 'Segoe UI', sans-serif",
  mono:   "'Courier New', Courier, monospace",
  serif:  "Georgia, 'Times New Roman', serif",
};

function applyTheme(settings) {
  const t = THEMES[settings.theme] || THEMES.green;
  const root = document.documentElement;
  root.style.setProperty('--g',   t.g);
  root.style.setProperty('--gd',  t.gd);
  root.style.setProperty('--gl',  t.gl);
  root.style.setProperty('--au',  t.au);
  root.style.setProperty('--ald', t.ald);
  root.style.setProperty('--text',t.text);
  if (settings.primary_color) root.style.setProperty('--g',   settings.primary_color);
  if (settings.accent_color)  root.style.setProperty('--au',  settings.accent_color);
  document.body.style.background = settings.bg_color || t.bg;
  document.body.style.color      = t.text;
  document.body.style.fontFamily = FONTS[settings.font] || FONTS.segoe;
  // Portal name in sidebar
  const brandEl = document.querySelector('.sidebar-brand span');
  if (brandEl && settings.portal_name) brandEl.innerHTML = `${settings.portal_name}<br/>PUCIT`;
  document.title = settings.portal_name || 'SCNRO – PUCIT Smart Campus';
  // Logo
  const logoEl = document.querySelector('.sidebar-brand .logo');
  if (logoEl && settings.logo_url) {
    logoEl.innerHTML = `<img src="${settings.logo_url}" style="width:32px;height:32px;border-radius:50%;object-fit:cover"/>`;
  }
}

async function loadAndApplySettings() {
  try {
    const r = await apiFetch('/admin/settings');
    if (!r || !r.ok) return;
    const d = await r.json();
    if (d.settings) applyTheme(d.settings);
  } catch(e) { /* ignore */ }
}

/* ═══════════════════════════════ AUTH ═══════════════════════════════ */
function showLogin() {
  document.documentElement.className = 'guest';
  $id('screen-signup').style.display = 'none';
  $id('screen-login').style.display  = 'flex';
}
function showSignup() {
  document.documentElement.className = 'signup';
  $id('screen-login').style.display  = 'none';
  $id('screen-signup').style.display = 'flex';
}
function updateSignupDeptVisibility() {
  // All roles get a department field — always visible
}

async function doLogin(e) {
  e && e.preventDefault();
  const email = $id('li-email').value.trim();
  const pass  = $id('li-pass').value;
  const msg   = $id('login-msg');
  const btn   = $id('login-btn');
  if (!email || !pass) { showMsg(msg,'Please enter email and password.'); return; }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Signing in…';
  try {
    const r = await fetch(API + '/auth/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, password: pass})
    });
    const data = await r.json();
    if (!r.ok) { showMsg(msg, data.detail || 'Invalid credentials.'); return; }
    _token = data.access_token;
    const me = await (await apiFetch('/auth/me')).json();
    _user = me;
    localStorage.setItem('scnro_token', _token);
    localStorage.setItem('scnro_user', JSON.stringify(_user));
    bootApp();
  } catch(err) {
    showMsg(msg, 'Connection error. Try again.');
  } finally {
    btn.disabled=false; btn.textContent='Sign In';
  }
}

async function doSignup() {
  const name  = $id('su-name').value.trim();
  const email = $id('su-email').value.trim();
  const role  = $id('su-role').value;
  const dept  = $id('su-dept').value;
  const pass  = $id('su-pass').value;
  const msg   = $id('signup-msg');
  if (!name||!email||!pass) { showMsg(msg,'All fields are required.'); return; }
  if (pass.length < 6)      { showMsg(msg,'Password must be at least 6 characters.'); return; }
  const r = await apiFetch('/auth/signup-request', {
    method:'POST',
    body: JSON.stringify({name, email, password:pass, role, department: dept||null})
  });
  if (!r) return;
  const data = await r.json();
  if (!r.ok) { showMsg(msg, data.detail || 'Error.'); return; }
  showMsg(msg,'✓ Request submitted! Wait for admin approval.','success');
  setTimeout(showLogin, 2000);
}

function doLogout() {
  _token=''; _user=null;
  localStorage.removeItem('scnro_token');
  localStorage.removeItem('scnro_user');
  document.documentElement.className='guest';
  $id('screen-app').style.display='none';
  $id('screen-login').style.display='flex';
  $id('screen-signup').style.display='none';
}

/* ═══════════════════════════════ NAV ════════════════════════════════ */
const NAV_ALL = [
  {id:'dashboard',   ico:'🏠', lbl:'Dashboard'},
  {id:'free_rooms',  ico:'🚪', lbl:'Free Rooms'},
  {id:'navigate',    ico:'🗺', lbl:'Navigate'},
  {id:'lostfound',   ico:'🔍', lbl:'Lost & Found'},
  {id:'faculty',     ico:'👥', lbl:'Faculty',         roles:['admin','degree_coordinator']},
  {id:'admin_panel', ico:'⚙',  lbl:'Admin Panel',     roles:['admin']},
  {id:'marks_mgmt',  ico:'📊', lbl:'Marks Mgmt',      roles:['teacher','admin']},
  {id:'my_grades',   ico:'🎓', lbl:'My Grades',        roles:['student']},
  {id:'room_mgmt',   ico:'🏢', lbl:'Room Mgmt',        roles:['head_clerk','admin']},
  {id:'course_mgmt', ico:'📚', lbl:'Course Mgmt',      roles:['head_clerk','admin']},
  {id:'dc_panel',    ico:'🎯', lbl:'My Section',       roles:['degree_coordinator']},
];

let _currentPane = '';

function buildNav() {
  const role = _user.role;
  const nav = $id('sidebar-nav');
  nav.innerHTML = '';
  NAV_ALL.forEach(item => {
    if (item.roles && !item.roles.includes(role)) return;
    const el = document.createElement('div');
    el.className = 'nav-item';
    el.dataset.pane = item.id;
    el.innerHTML = `<span class="ico">${item.ico}</span><span>${item.lbl}</span>`;
    el.addEventListener('click', () => showPane(item.id));
    nav.appendChild(el);
  });
}

function showPane(id) {
  _currentPane = id;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.pane === id);
  });
  const mc = $id('main-content');
  mc.innerHTML = '<div style="text-align:center;padding:2rem"><span class="spinner"></span> Loading…</div>';
  PANES[id] ? PANES[id](mc) : (mc.innerHTML='<p>Pane not found.</p>');
}

/* ═════════════════════════════ BOOT APP ════════════════════════════ */
function bootApp() {
  document.documentElement.className = 'authed';
  $id('screen-login').style.display  = 'none';
  $id('screen-signup').style.display = 'none';
  $id('screen-app').style.display    = 'flex';

  $id('sb-name').textContent  = _user.name;
  $id('sb-email').textContent = _user.email;
  $id('sb-role-badge').textContent = fmtRole(_user.role) + (_user.department ? ' · ' + _user.department : '');

  buildNav();

  // Apply portal settings (theme, name, logo)
  if (_user.role === 'admin' || _user.role === 'teacher' || _user.role === 'head_clerk' ||
      _user.role === 'degree_coordinator') {
    loadAndApplySettings();
  }

  // Pick the first pane visible for this role
  const first = NAV_ALL.find(n => !n.roles || n.roles.includes(_user.role));
  if (first) showPane(first.id);
}

async function loadFreeRooms() {
  const lat  = $id('u-lat').value;
  const lng  = $id('u-lng').value;
  const dist = $id('u-dist').value;
  const el   = $id('free-rooms-result');
  el.innerHTML = '<span class="spinner"></span> Searching…';
  try {
    const r = await apiFetch(`/resources/free-rooms?user_lat=${lat}&user_lng=${lng}&max_distance=${dist}`);
    const d = await r.json();
    const rooms = d.free_rooms || [];
    if (!rooms.length) { el.innerHTML='<div class="alert alert-info">No free rooms found nearby.</div>'; return; }
    el.innerHTML = `<div class="card"><div class="tbl-wrap"><table>
      <thead><tr><th>Room</th><th>Category</th><th>Wing</th><th>Floor</th><th>Distance</th></tr></thead>

        <td>${r.name}</td><td>${r.category||'—'}</td><td>${r.wing_name||'—'}</td>
        <td>${r.floor_level??'—'}</td><td>${r.distance_m!=null?r.distance_m.toFixed(0)+' m':'—'}</td>
      </tr>`).join('')}</tbody></table></div></div>`;
  } catch(e) { el.innerHTML='<div class="alert alert-danger">Error loading rooms.</div>'; }
}

async function loadNavRoute() {
  const from = $id('nav-from').value;
  const to   = $id('nav-to').value;
  const el   = $id('nav-result');
  if (!from||!to) { el.innerHTML='<div class="alert alert-warn">Enter both IDs.</div>'; return; }
  el.innerHTML='<span class="spinner"></span>';
  const r = await apiFetch(`/navigate?from_id=${from}&to_id=${to}`);
  const d = await r.json();
  if (!r.ok) { el.innerHTML=`<div class="alert alert-danger">${d.detail||'Not found.'}</div>`; return; }
  const steps = d.path||[];
  el.innerHTML=`<div class="card"><b>Route (${steps.length} steps):</b><ol style="margin-top:.5rem;padding-left:1.3rem">
    ${steps.map(s=>`<li style="padding:.2rem 0">${s.name} <span class="badge badge-grey">${s.category||''}</span></li>`).join('')}
  </ol></div>`;
}

PANES.lostfound = async mc => {
  mc.innerHTML = `<h2>🔍 Lost &amp; Found</h2>
  <div class="card">
    <div class="card-title">Report Item</div>
    <div class="form-row">
      <div class="form-field"><label>Item Name *</label><input id="lf-name" placeholder="e.g. Black Wallet"/></div>
      <div class="form-field"><label>Status</label>
        <select id="lf-status"><option value="Lost">Lost</option><option value="Found">Found</option></select>
      </div>

    </div>
    <div class="form-field"><label>Description</label><textarea id="lf-desc" rows="2" placeholder="Details…"></textarea></div>
    <div class="form-actions"><button class="btn btn-accent btn-sm" onclick="submitLostFound()">📤 Submit Report</button></div>
    <div id="lf-msg"></div>
  </div>
  <div class="card" id="lf-list-card">
    <div class="card-title">📋 Reports</div>
    <div id="lf-list"><span class="spinner"></span></div>
  </div>`;
  loadLFList();
};
async function loadLFList() {
  const r = await apiFetch('/items');
  const d = await r.json();
  const items = d.items||[];
  const isSAC = _user.role==='sac'||_user.role==='admin';
  $id('lf-list').innerHTML = items.length ? `<div class="tbl-wrap"><table>
    <thead><tr><th>#</th><th>Item</th><th>Status</th><th>Description</th><th>Date</th>${isSAC?'<th>Action</th>':''}</tr></thead>
    <tbody>${items.map(it=>`<tr>
      <td>${it.item_id}</td><td>${it.item_name}</td>
      <td>${badge(it.status, it.status==='Closed'?'badge-grey':it.status==='Lost'?'badge-red':'badge-green')}</td>
      <td>${it.description||'—'}</td>
      <td>${it.created_at?new Date(it.created_at).toLocaleDateString():'—'}</td>
      ${isSAC?`<td>${it.status!=='Closed'?`<button class="btn btn-sm btn-danger" onclick="closeLFItem(${it.item_id})">Close</button>`:badge('Closed','badge-grey')}</td>`:''}`
    ).join('')}</tbody></table></div>` : '<p style="color:var(--muted)">No reports found.</p>';
}
async function submitLostFound() {
  const body = {
    item_name:   $id('lf-name').value.trim(),
    status:      $id('lf-status').value,
    description: $id('lf-desc').value.trim(),
    location_last_seen: $id('lf-loc').value ? parseInt($id('lf-loc').value) : null,
  };
  if (!body.item_name) { $id('lf-msg').innerHTML='<div class="alert alert-warn">Item name required.</div>'; return; }
  const r = await apiFetch('/items/report', {method:'POST', body:JSON.stringify(body)});
  const d = await r.json();
  if (!r.ok) { $id('lf-msg').innerHTML=`<div class="alert alert-danger">${d.detail}</div>`; return; }
  $id('lf-msg').innerHTML='<div class="alert alert-success">✓ Report submitted.</div>';
  ['lf-name','lf-desc','lf-loc'].forEach(i=>$id(i).value='');
  loadLFList();
}
async function closeLFItem(id) {
  if (!confirm('Mark this item as Closed?')) return;
  const r = await apiFetch(`/items/${id}/close`, {method:'PATCH'});
  const d = await r.json();
  if (!r.ok) { alert(d.detail); return; }
  loadLFList();
}

function escHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');
}

async function approveSignup(id){
  const r=await apiFetch(`/admin/signup-requests/${id}/approve`,{method:'POST'});
  if(!r.ok){alert((await r.json()).detail);return;}
  loadSignupRequests();
}
async function rejectSignup(id){
  if(!confirm('Reject this request?'))return;
  const r=await apiFetch(`/admin/signup-requests/${id}/reject`,{method:'POST'});
  if(!r.ok){alert((await r.json()).detail);return;}
  loadSignupRequests();
}
function toggleAll(cls, cb) { document.querySelectorAll('.'+cls).forEach(c=>c.checked=cb.checked); }
function bulkSelectAll(cls) { document.querySelectorAll('.'+cls).forEach(c=>c.checked=true); }
function bulkDeselectAll(cls) { document.querySelectorAll('.'+cls).forEach(c=>c.checked=false); }
function getChecked(cls) { return [...document.querySelectorAll('.'+cls+':checked')].map(c=>parseInt(c.value)); }
async function bulkApproveSignups(){
  const ids=getChecked('su-chk'); if(!ids.length){alert('Select at least one.');return;}
  const r=await apiFetch('/admin/signup-requests/bulk-approve',{method:'POST',body:JSON.stringify({ids})});
  if(!r.ok){alert((await r.json()).detail);return;}
  loadSignupRequests();
}
async function bulkRejectSignups(){
  const ids=getChecked('su-chk'); if(!ids.length){alert('Select at least one.');return;}
  if(!confirm(`Reject ${ids.length} requests?`))return;
  const r=await apiFetch('/admin/signup-requests/bulk-reject',{method:'POST',body:JSON.stringify({ids})});
  if(!r.ok){alert((await r.json()).detail);return;}
  loadSignupRequests();
}
async function loadStaffMgmt() {
  $id('ap-staff').innerHTML='<span class="spinner"></span>';
  const r=await apiFetch('/admin/staff');
  const d=await r.json();
  const users=d.staff||[];
  $id('ap-staff').innerHTML=`<div class="card"><div class="card-title">Portal Users (${users.length})</div>
  <div style="margin-bottom:.6rem"><button class="btn btn-primary btn-sm" onclick="openAddStaffModal()">➕ Add User</button></div>
  <div class="tbl-wrap"><table>
    <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Dept</th><th>Active</th><th>Actions</th></tr></thead>
    <tbody>${users.map(u=>`<tr>
      <td>${u.name}</td><td>${u.email}</td><td>${badge(fmtRole(u.role),'badge-blue')}</td>
      <td>${u.department||'—'}</td>
      <td>${badge(u.is_active?'Yes':'No',u.is_active?'badge-green':'badge-red')}</td>
      <td>
        <button class="btn btn-sm btn-ghost" onclick="openEditStaffModal(${u.user_id},'${escHtml(u.name)}','${escHtml(u.email)}','${u.role}',${u.is_active},'${escHtml(u.department||'')}')">Edit</button>
        ${u.is_active
          ? `<button class="btn btn-sm btn-danger" onclick="deleteStaff(${u.user_id})">Deactivate</button>`
          : `<button class="btn btn-sm btn-primary" onclick="reactivateStaff(${u.user_id})">Activate</button>`}
      </td></tr>`).join('')}</tbody></table></div></div>`;
}
const DEPT_OPTIONS = ['','IT','CS','SE','DS','AI'];
function deptSelect(id,val=''){
  return `<select id="${id}"><option value="">— No Dept —</option>${DEPT_OPTIONS.filter(d=>d).map(d=>`<option value="${d}" ${d===val?'selected':''}>${d}</option>`).join('')}</select>`;
}
function openAddStaffModal(){
  openModal('Add User',`
    <div class="form-field"><label>Full Name</label><input id="as-name"/></div>
    <div class="form-field"><label>Email</label><input id="as-email" type="email"/></div>
    <div class="form-field"><label>Password</label><input id="as-pass" type="password"/></div>
    <div class="form-field"><label>Role</label>
      <select id="as-role">
        <option value="student">Student</option><option value="teacher">Teacher</option>
        <option value="sac">SAC Officer</option><option value="head_clerk">Head Clerk</option>
        <option value="degree_coordinator">Degree Coordinator</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <div class="form-field"><label>Department</label>${deptSelect('as-dept')}</div>`,
    `<button class="btn btn-primary btn-sm" onclick="addStaff()">Add</button>
     <button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancel</button>`
  );
}
async function addStaff(){
  const payload={email:$id('as-email').value.trim(),name:$id('as-name').value.trim(),
    password:$id('as-pass').value,role:$id('as-role').value,
    department:$id('as-dept').value||null};
  if(!payload.name||!payload.email||!payload.password){alert('Fill all fields.');return;}
  const r=await apiFetch('/admin/staff',{method:'POST',body:JSON.stringify(payload)});
  if(!r.ok){alert((await r.json()).detail);return;}
  closeModal(); loadStaffMgmt();
}
function openEditStaffModal(id,name,email,role,active,dept=''){
  openModal('Edit User',`
    <div class="form-field"><label>Name</label><input id="es-name" value="${escHtml(name)}"/></div>
    <div class="form-field"><label>Email</label><input id="es-email" value="${escHtml(email)}"/></div>
    <div class="form-field"><label>New Password (leave blank to keep)</label><input id="es-pass" type="password"/></div>
    <div class="form-field"><label>Role</label>
      <select id="es-role">
        <option value="student" ${role==='student'?'selected':''}>Student</option>
        <option value="teacher" ${role==='teacher'?'selected':''}>Teacher</option>
        <option value="sac"     ${role==='sac'?'selected':''}>SAC Officer</option>
        <option value="head_clerk" ${role==='head_clerk'?'selected':''}>Head Clerk</option>
        <option value="degree_coordinator" ${role==='degree_coordinator'?'selected':''}>Degree Coordinator</option>
        <option value="admin"  ${role==='admin'?'selected':''}>Admin</option>
      </select>
    </div>
    <div class="form-field"><label>Department</label>${deptSelect('es-dept',dept)}</div>
    <div class="form-field"><label>Active</label>
      <select id="es-active">
        <option value="true"  ${active?'selected':''}>Yes</option>
        <option value="false" ${!active?'selected':''}>No</option>
      </select>
    </div>`,
    `<button class="btn btn-primary btn-sm" onclick="saveStaff(${id})">Save</button>
     <button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancel</button>`
  );
}
async function saveStaff(id){
  const payload={};
  const n=$id('es-name').value.trim(),e=$id('es-email').value.trim(),p=$id('es-pass').value;
  if(n) payload.name=n; if(e) payload.email=e; if(p) payload.password=p;
  payload.role=$id('es-role').value;
  payload.department=$id('es-dept').value||null;
  payload.is_active=$id('es-active').value==='true';
  const r=await apiFetch(`/admin/staff/${id}`,{method:'PUT',body:JSON.stringify(payload)});
  if(!r.ok){alert((await r.json()).detail);return;}
  closeModal(); loadStaffMgmt();
}
async function deleteStaff(id){
  if(!confirm('Deactivate this user?'))return;
  const r=await apiFetch(`/admin/staff/${id}`,{method:'DELETE'});
  if(!r.ok){alert((await r.json()).detail);return;}
  loadStaffMgmt();
}
async function reactivateStaff(id){

  const r=await apiFetch(`/admin/staff/${id}/reactivate`,{method:'POST'});
  if(!r.ok){alert((await r.json()).detail);return;}
  loadStaffMgmt();
}

        </div>
        <div class="form-field"><label>Background Color</label>
          <input type="color" id="set-bg-color" value="${s.bg_color||'#f4f6f8'}" style="height:36px;width:80px;padding:2px;border-radius:4px;border:1px solid var(--border)"/>

      <button class="btn btn-primary btn-sm" onclick="saveSettings()">💾 Save Settings</button>

function setTab(btn, pane) {
  btn.closest('.card').querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  ['set-general','set-appearance','set-access'].forEach(id=>{
    const el=$id(id); if(el) el.style.display='none';
  });
  const el=$id(pane); if(el) el.style.display='';
}
function previewTheme() {
  applyTheme({
    theme: $id('set-theme')?.value,
    font: $id('set-font')?.value,
    primary_color: $id('set-primary-color')?.value,
    accent_color: $id('set-accent-color')?.value,
    bg_color: $id('set-bg-color')?.value,
    portal_name: $id('set-name')?.value,
    logo_url: $id('set-logo')?.value,
  });
}
async function saveSettings(){
  const settings={
    portal_name: $id('set-name').value.trim(),
    logo_url: $id('set-logo').value.trim(),
    theme: $id('set-theme').value,
    font: $id('set-font').value,
    primary_color: $id('set-primary-color').value,
    accent_color: $id('set-accent-color').value,
    bg_color: $id('set-bg-color').value,
    portal_available: $id('set-avail').value,
    unavailable_message: $id('set-unavail-msg').value.trim(),
  };
  const r=await apiFetch('/admin/settings',{method:'PUT',body:JSON.stringify({settings})});
  const d=await r.json();
  if(!r.ok){$id('set-msg-res').innerHTML=`<div class="alert alert-danger">${d.detail}</div>`;return;}
  applyTheme(settings);
  $id('set-msg-res').innerHTML='<div class="alert alert-success">✓ Settings saved and applied.</div>';
}
async function resetAllData(){
  if(!confirm('⚠️ This will DELETE ALL data. Admin accounts will be preserved. Type "RESET" to confirm.'))return;
  const c=prompt('Type RESET to confirm:');
  if(c!=='RESET')return;
  const r=await apiFetch('/admin/reset-data',{method:'POST'});
  const d=await r.json();
  if(!r.ok){alert(d.detail);return;}
  alert('✓ All data erased.');
  loadAdminSettings();
}

async function loadCourseMarks(courseId, code, name) {
  const det = $id('mgt-detail');
  det.innerHTML=`<div class="card"><span class="spinner"></span> Loading…</div>`;
  const [studR, marksR, locksR] = await Promise.all([
    apiFetch(`/courses/${courseId}/students`).then(r=>r.json()),
    apiFetch(`/courses/${courseId}/marks`).then(r=>r.json()),
    apiFetch(`/courses/${courseId}/locks`).then(r=>r.json()),
  ]);
  const students = studR.students||[];
  const allMarks = marksR.marks||[];
  const locks    = locksR.locks||{};
  const CATS = ['attendance','quiz','activity','mid','final'];

  function renderCourseDetail() {
    let html = `<div class="card">
      <div class="card-title">📋 ${code} – ${name}</div>
      <div class="tab-bar" id="cat-tabs">
        ${CATS.map((c,i)=>`<button class="tab-btn ${i===0?'active':''}" onclick="switchCat(this,'${c}')">${c.charAt(0).toUpperCase()+c.slice(1)}</button>`).join('')}
      </div>`;
    CATS.forEach((cat,i)=>{
      const isLocked = !!locks[cat];
      const catMarks = allMarks.filter(m=>m.category===cat);
      html += `<div id="cat-pane-${cat}" style="${i>0?'display:none':''}">
        <div style="display:flex;align-items:center;gap:.6rem;margin-bottom:.7rem;flex-wrap:wrap">
          ${isLocked
            ? `<span class="badge badge-gold">🔒 Finalized</span><button class="btn btn-sm btn-ghost" onclick="openMCRModal(${courseId},'${cat}',${JSON.stringify(students).replace(/"/g,'&quot;')})">📩 Request Change</button>`
            : `<button class="btn btn-sm btn-accent" onclick="openAddMarkModal(${courseId},'${cat}',${JSON.stringify(students).replace(/"/g,'&quot;')})">➕ Add Mark</button>
               <button class="btn btn-sm btn-primary" onclick="finalizeCat(${courseId},'${cat}')">🔒 Finalize</button>`
          }
          ${_user.role==='teacher'||_user.role==='admin'?`<button class="btn btn-sm btn-ghost" onclick="downloadPDF(${courseId})">📄 Download PDF</button>`:''}
        </div>
        <div class="tbl-wrap"><table>
          <thead><tr><th>Student</th><th>Title</th><th>Obtained</th><th>Total</th>${isLocked?'':'<th>Actions</th>'}</tr></thead>
          <tbody>
            ${students.map(s=>{
              const m = catMarks.filter(x=>x.student_id===s.student_id);
              if(!m.length) return `<tr><td>${s.name}</td><td colspan="3" style="color:var(--muted)">Not uploaded</td>${isLocked?'':'<td></td>'}</tr>`;
              return m.map(mk=>`<tr>
                <td>${s.name}</td><td>${mk.title}</td>
                <td>${mk.marks_obtained??'—'}</td><td>${mk.total_marks??'—'}</td>
                ${isLocked?'':`<td>
                  <button class="btn btn-sm btn-ghost" onclick="openEditMarkModal(${mk.record_id},'${escHtml(mk.title)}',${mk.marks_obtained??''},${mk.total_marks??''})">Edit</button>

                </td>`}
              </tr>`).join('');
            }).join('')}
          </tbody>
        </table></div>
      </div>`;
    });
    html += '</div>';
    det.innerHTML = html;
  }
  renderCourseDetail();

  // keep references for reload
  det._reload = () => loadCourseMarks(courseId, code, name);
}

async function downloadPDF(courseId){
  const token=_token;
  const a=document.createElement('a');
  a.href=`${API}/courses/${courseId}/report.pdf`;
  // Trigger with auth header via fetch + blob
  fetch(a.href,{headers:{'Authorization':'Bearer '+token}})
    .then(r=>{if(!r.ok)throw new Error('PDF error');return r.blob();})
    .then(blob=>{
      const url=URL.createObjectURL(blob);
      const link=document.createElement('a');
      link.href=url; link.download=`course_${courseId}_result.pdf`;
      link.click(); URL.revokeObjectURL(url);
    }).catch(e=>alert('PDF download failed: '+e.message));
}

  openModal(`Request Mark Change — ${cat}`,`

      <select id="mcr-student" onchange="loadCurrentMark(${courseId},'${cat}')">${students.map(s=>`<option value="${s.student_id}" data-name="${escHtml(s.name)}">${s.name}</option>`).join('')}</select>

      <select id="mcr-record"><option value="">— select after loading —</option></select>
    </div>
    <div class="form-field"><label>New Marks Obtained *</label><input id="mcr-new-obt" type="number" step="0.01"/></div>
    <div class="form-field"><label>New Total Marks (optional)</label><input id="mcr-new-tot" type="number" step="0.01"/></div>
    <div class="form-field"><label>Reason *</label><textarea id="mcr-reason" rows="3" placeholder="Explain why marks should change…"></textarea></div>`,
    `<button class="btn btn-accent btn-sm" onclick="submitMCR(${courseId},'${cat}')">📩 Send Request</button>

async function loadCurrentMark(courseId, cat){
  const studId = $id('mcr-student').value;
  const infoEl = $id('mcr-current-info');
  const recEl  = $id('mcr-record');
  if(!infoEl||!recEl) return;
  infoEl.textContent='Loading…';
  const r = await apiFetch(`/courses/${courseId}/marks`);
  const d = await r.json();
  const recs = (d.marks||[]).filter(m=>m.student_id===parseInt(studId)&&m.category===cat);
  if(!recs.length){ infoEl.textContent='No marks in this category for selected student.'; recEl.innerHTML='<option>No records</option>'; return; }
  recEl.innerHTML = recs.map(m=>`<option value="${m.record_id}">${m.title}: ${m.marks_obtained??'–'}/${m.total_marks??'–'}</option>`).join('');
  const first=recs[0];
  infoEl.innerHTML=`Current: <b>${first.title}</b> — ${first.marks_obtained??'–'} / ${first.total_marks??'–'}`;
  $id('mcr-new-obt').value = first.marks_obtained??'';
  $id('mcr-new-tot').value = first.total_marks??'';
}
async function submitMCR(courseId,cat){
  const recId  = parseInt($id('mcr-record').value);
  const newObt = parseFloat($id('mcr-new-obt').value);
  const newTot = $id('mcr-new-tot').value ? parseFloat($id('mcr-new-tot').value) : null;
  const reason = $id('mcr-reason').value.trim();
  if(!recId||isNaN(newObt)||!reason){alert('Fill all required fields.');return;}
  const payload={record_id:recId,new_marks_obtained:newObt,reason};
  if(newTot!==null) payload.new_total_marks=newTot;
  const r=await apiFetch('/marks/change-request',{method:'POST',body:JSON.stringify(payload)});
  const d=await r.json();
  if(!r.ok){alert(d.detail);return;}
  closeModal();
  alert('✓ Change request sent to admin.');
}

async function openManageSectionStudents(sectionId, sectionName){
  const [secStudR, allStudR] = await Promise.all([
    apiFetch(`/clerk/sections/${sectionId}/students`).then(r=>r.json()),
    apiFetch('/clerk/students').then(r=>r.json()),
  ]);
  const students=secStudR.students||[];

  const enrolledIds=new Set(students.map(s=>s.student_id));
  openModal(`Students in ${sectionName}`,`
    <p style="font-size:.83rem;color:var(--muted);margin-bottom:.6rem">Enrolled: ${students.length}</p>
    ${students.length?`<div class="tbl-wrap" style="max-height:200px;overflow-y:auto"><table>

      </tr>`).join('')}</tbody></table></div>`:''
    }

    <div class="form-field"><label>Add Student</label>
      <select id="sec-add-stud">

        ${allStudents.filter(u=>!enrolledIds.has(u.user_id)).map(u=>`<option value="${u.user_id}">${u.name}${u.department?' ('+u.department+')':''} – ${u.email}</option>`).join('')}

async function addToSection(sectionId){

  const r=await apiFetch(`/clerk/sections/${sectionId}/students`,{method:'POST',body:JSON.stringify({student_id:sid})});
  if(!r.ok){alert((await r.json()).detail);return;}
  closeModal();
  const locR=await apiFetch('/clerk/sections').then(r=>r.json());
  const s=(locR.sections||[]).find(s=>s.section_id===sectionId);
  if(s) openManageSectionStudents(sectionId,s.name);
  if($id('cm-sections')) loadCMSections();
}
async function removeFromSection(sectionId,studentId){
  if(!confirm('Remove student from section?'))return;
  const r=await apiFetch(`/clerk/sections/${sectionId}/students/${studentId}`,{method:'DELETE'});
  if(!r.ok){alert((await r.json()).detail);return;}
  const locR=await apiFetch('/clerk/sections').then(r=>r.json());
  const s=(locR.sections||[]).find(s=>s.section_id===sectionId);
  closeModal();
  if(s) openManageSectionStudents(sectionId,s.name);
  if($id('cm-sections')) loadCMSections();
}

function dcTab(btn,pane){

  ['dc-overview','dc-students','dc-schedule','dc-teachers','dc-enroll'].forEach(id=>{const el=$id(id);if(el)el.style.display='none';});
  $id(pane).style.display='';

  if(pane==='dc-students') loadDCStudents();

async function viewStudentReport(studentId, studentName){
  const r=await apiFetch(`/dc/students/${studentId}/report`);
  if(!r||!r.ok){alert('Could not load report.');return;}
  const d=await r.json();
  const courses=d.courses||[];
  let html=`<h3>${studentName}</h3><p style="color:var(--muted);font-size:.82rem">${d.email}</p>`;
  if(!courses.length){html+='<p>No courses enrolled.</p>';}
  courses.forEach(c=>{
    html+=`<div style="margin-top:.8rem;border-top:1px solid var(--border);padding-top:.6rem">
      <b>${c.code} – ${c.name}</b> <span style="color:var(--muted);font-size:.8rem">Section: ${c.section||'—'} | Teacher: ${c.teacher_name}</span>
      <table style="width:100%;font-size:.82rem;margin-top:.4rem"><thead><tr>`;
    ['Attendance','Quiz','Activity','Mid','Final'].forEach(cat=>html+=`<th style="background:var(--g);color:white;padding:.3rem .5rem">${cat}</th>`);
    html+=`</tr></thead><tbody><tr>`;
    ['attendance','quiz','activity','mid','final'].forEach(cat=>{
      const marks=c.marks[cat]||[];
      html+=`<td style="padding:.3rem .5rem;vertical-align:top">${marks.length?marks.map(m=>`${m.title}: ${m.marks_obtained??'–'}/${m.total_marks??'–'}`).join('<br>'):'—'}</td>`;
    });
    html+=`</tr></tbody></table></div>`;
  });
  openModal(`Progress Report – ${studentName}`, html);
}

}
async function dcApproveEnroll(id){
  const r=await apiFetch(`/dc/enrollment-requests/${id}/approve`,{method:'POST'});
  if(!r.ok){alert((await r.json()).detail);return;}
  loadDCEnrollRequests();
}
async function dcRejectEnroll(id){
  if(!confirm('Reject this enrollment request?'))return;
  const r=await apiFetch(`/dc/enrollment-requests/${id}/reject`,{method:'POST'});
  if(!r.ok){alert((await r.json()).detail);return;}
  loadDCEnrollRequests();
}
async function dcBulkApprove(){
  const ids=getChecked('dc-er-chk'); if(!ids.length){alert('Select at least one.');return;}
  const r=await apiFetch('/dc/enrollment-requests/bulk-approve',{method:'POST',body:JSON.stringify({request_ids:ids})});
  if(!r.ok){alert((await r.json()).detail);return;}
  loadDCEnrollRequests();
}
async function dcBulkReject(){
  const ids=getChecked('dc-er-chk'); if(!ids.length){alert('Select at least one.');return;}
  if(!confirm(`Reject ${ids.length} enrollment requests?`))return;
  const r=await apiFetch('/dc/enrollment-requests/bulk-reject',{method:'POST',body:JSON.stringify({request_ids:ids})});
  if(!r.ok){alert((await r.json()).detail);return;}
  loadDCEnrollRequests();
}

/* ── Student: Enrollment Requests ────────────────────────────────────── */
async function loadEnrollmentRequests(){
  const el=$id('enroll-req-body');
  if(!el) return;
  el.innerHTML='<span class="spinner"></span>';
  const r=await apiFetch('/enrollment-requests/my');
  const d=await r.json();
  const reqs=d.requests||[];
  el.innerHTML=reqs.length?`<div class="tbl-wrap"><table>
    <thead><tr><th>Course</th><th>Teacher</th><th>Status</th><th>Date</th></tr></thead>
    <tbody>${reqs.map(q=>`<tr>
      <td>${q.course_code} — ${q.course_name}</td><td>${q.teacher_name}</td>
      <td>${badge(q.status, q.status==='approved'?'badge-green':q.status==='rejected'?'badge-red':'badge-blue')}</td>
      <td>${new Date(q.created_at).toLocaleDateString()}</td>
    </tr>`).join('')}</tbody></table></div>`
    :`<p style="color:var(--muted)">No enrollment requests yet.</p>`;
}
async function openEnrollReqModal(){
  const r=await apiFetch('/courses').then(r=>r.json());
  // Get all courses (student sees available ones via public endpoint)
  const allR=await apiFetch('/courses/available').then(r=>r.ok?r.json():{courses:[]}).catch(()=>({courses:[]}));
  const courses=allR.courses||r.courses||[];
  if(!courses.length){alert('No available courses found.');return;}
  openModal('Request Enrollment',`
    <div class="form-field"><label>Select Course *</label>
      <select id="er-course">${courses.map(c=>`<option value="${c.course_id}">${c.code} — ${c.name} (${c.teacher_name||''})</option>`).join('')}</select>
    </div>`,
    `<button class="btn btn-primary btn-sm" onclick="submitEnrollReq()">Submit Request</button>
     <button class="btn btn-ghost btn-sm"   onclick="closeModal()">Cancel</button>`
  );
}
async function submitEnrollReq(){
  const courseId=parseInt($id('er-course').value);
  const r=await apiFetch('/enrollment-requests',{method:'POST',body:JSON.stringify({course_id:courseId})});
  if(!r.ok){alert((await r.json()).detail);return;}
  closeModal(); loadEnrollmentRequests();
}
