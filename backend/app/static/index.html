<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SCNRO – PUCIT Smart Campus</title>
<!-- Anti-flash: runs synchronously before first paint -->
<script>
(function(){
  var t=localStorage.getItem('scnro_token'),u=localStorage.getItem('scnro_user');
  document.documentElement.className=t&&u?'authed':'guest';
})();
</script>
<style>
/* ── Reset ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f4f6f8;color:#222;min-height:100vh}

/* ── PUCIT colour palette ── */
:root{
  --g:#006633;      /* PUCIT green  */
  --gd:#004d26;     /* darker green */
  --gl:#e6f4ee;     /* light green  */
  --au:#C9A227;     /* gold accent  */
  --ald:#a07d15;
  --white:#fff;
  --grey:#f1f3f5;
  --border:#d1d5db;
  --text:#222;
  --muted:#6b7280;
  --danger:#dc2626;
  --info:#1d4ed8;
  --radius:8px;
  --shadow:0 2px 8px rgba(0,0,0,.12);
}

/* ── Anti-flash: hide wrong screen before JS fully loads ── */
html.guest   #screen-app    {display:none!important}
html.guest   #screen-signup {display:none!important}
html.authed  #screen-login  {display:none!important}
html.authed  #screen-signup {display:none!important}
html:not(.guest):not(.authed) #screen-login,
html:not(.guest):not(.authed) #screen-app,
html:not(.guest):not(.authed) #screen-signup{display:none!important}

/* ── Typography ── */
h2{font-size:1.3rem;font-weight:700;color:var(--g);margin-bottom:1rem}
h3{font-size:1.05rem;font-weight:600;color:var(--gd);margin-bottom:.6rem}

/* ── Auth screens ── */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--gd) 0%,var(--g) 60%,var(--au) 100%)}
.auth-card{background:var(--white);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.25);width:380px;overflow:hidden}
.auth-header{background:var(--g);color:var(--white);padding:1.4rem 1.6rem;display:flex;align-items:center;gap:.8rem}
.auth-header img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--au)}
.auth-header h1{font-size:1.15rem;font-weight:700;line-height:1.2}
.auth-header p{font-size:.75rem;opacity:.85}
.auth-body{padding:1.6rem}
.auth-body label{display:block;font-size:.82rem;font-weight:600;color:var(--gd);margin-bottom:.3rem;margin-top:.9rem}
.auth-body label:first-of-type{margin-top:0}
.auth-body input,.auth-body select{width:100%;padding:.55rem .75rem;border:1px solid var(--border);border-radius:var(--radius);font-size:.9rem;transition:border-color .2s}
.auth-body input:focus,.auth-body select:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px rgba(0,102,51,.15)}
.btn{display:inline-block;padding:.55rem 1.2rem;border:none;border-radius:var(--radius);font-size:.9rem;font-weight:600;cursor:pointer;transition:background .2s,opacity .2s}
.btn-primary{background:var(--g);color:var(--white)}
.btn-primary:hover{background:var(--gd)}
.btn-accent{background:var(--au);color:var(--white)}
.btn-accent:hover{background:var(--ald)}
.btn-danger{background:var(--danger);color:var(--white)}
.btn-danger:hover{opacity:.85}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{background:var(--grey)}
.btn-sm{padding:.3rem .75rem;font-size:.8rem}
.btn-full{width:100%;margin-top:1rem}
.auth-link{text-align:center;margin-top:.9rem;font-size:.83rem;color:var(--muted)}
.auth-link a{color:var(--g);font-weight:600;cursor:pointer;text-decoration:none}
.auth-link a:hover{text-decoration:underline}
.auth-msg{margin-top:.7rem;padding:.5rem .75rem;border-radius:var(--radius);font-size:.83rem;display:none}
.auth-msg.error{background:#fee2e2;color:#991b1b;display:block}
.auth-msg.success{background:#dcfce7;color:#166534;display:block}

/* ── App shell ── */
.app-shell{display:flex;height:100vh;overflow:hidden}

/* Sidebar */
.sidebar{width:220px;background:var(--g);color:var(--white);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-brand{padding:1rem 1.2rem;border-bottom:1px solid rgba(255,255,255,.15);display:flex;align-items:center;gap:.6rem}
.sidebar-brand .logo{width:36px;height:36px;background:var(--white);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--g);font-weight:700;font-size:.9rem;flex-shrink:0}
.sidebar-brand span{font-size:.85rem;font-weight:700;line-height:1.2}
.sidebar-user{padding:.8rem 1.2rem;border-bottom:1px solid rgba(255,255,255,.15);font-size:.78rem;opacity:.9}
.sidebar-user strong{display:block;font-size:.88rem}
.sidebar-user .role-badge{display:inline-block;margin-top:.2rem;background:var(--au);color:var(--white);font-size:.7rem;font-weight:700;padding:.1rem .4rem;border-radius:4px;text-transform:uppercase}
nav.sidebar-nav{flex:1;overflow-y:auto;padding:.5rem 0}
.nav-item{display:flex;align-items:center;gap:.6rem;padding:.62rem 1.2rem;cursor:pointer;font-size:.87rem;border-left:3px solid transparent;transition:background .15s,border-color .15s}
.nav-item:hover{background:rgba(255,255,255,.12)}
.nav-item.active{background:rgba(255,255,255,.18);border-left-color:var(--au);font-weight:600}
.nav-item .ico{font-size:1rem;width:18px;text-align:center}
.sidebar-footer{padding:.8rem 1.2rem;border-top:1px solid rgba(255,255,255,.15)}
.sidebar-footer .btn{background:rgba(255,255,255,.15);color:var(--white);border:1px solid rgba(255,255,255,.25);width:100%;font-size:.82rem}
.sidebar-footer .btn:hover{background:rgba(255,255,255,.25)}

/* Main content */
.main-content{flex:1;overflow-y:auto;padding:1.5rem;background:#f4f6f8}

/* ── Cards ── */
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.2rem;margin-bottom:1rem}
.card-title{font-size:1rem;font-weight:700;color:var(--gd);margin-bottom:.8rem;display:flex;align-items:center;gap:.4rem}

/* ── Stat grid ── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem;margin-bottom:1.2rem}
.stat-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:1rem;border-top:3px solid var(--g);text-align:center}
.stat-card .val{font-size:1.8rem;font-weight:700;color:var(--g)}
.stat-card .lbl{font-size:.78rem;color:var(--muted);margin-top:.2rem}

/* ── Table ── */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.87rem}
thead th{background:var(--g);color:var(--white);padding:.5rem .75rem;text-align:left;white-space:nowrap}
tbody tr:nth-child(even){background:var(--gl)}
tbody tr:hover{background:#d4edda}
tbody td{padding:.45rem .75rem;border-bottom:1px solid var(--border)}

/* ── Form ── */
.form-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.8rem;margin-bottom:.8rem}
.form-field{display:flex;flex-direction:column;gap:.3rem}
.form-field label{font-size:.8rem;font-weight:600;color:var(--gd)}
.form-field input,.form-field select,.form-field textarea{padding:.45rem .65rem;border:1px solid var(--border);border-radius:6px;font-size:.88rem;transition:border-color .2s}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px rgba(0,102,51,.12)}
.form-field textarea{resize:vertical;min-height:70px}
.form-actions{display:flex;gap:.6rem;margin-top:.8rem;flex-wrap:wrap}

/* ── Badge ── */
.badge{display:inline-block;padding:.15rem .5rem;border-radius:99px;font-size:.73rem;font-weight:600}
.badge-green{background:#dcfce7;color:#166534}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-orange{background:#ffedd5;color:#9a3412}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-grey{background:#f3f4f6;color:#374151}
.badge-gold{background:#fef9c3;color:#854d0e}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal-box{background:var(--white);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.2rem;border-bottom:1px solid var(--border)}
.modal-header h3{color:var(--gd)}
.modal-close{background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--muted);line-height:1}
.modal-close:hover{color:var(--danger)}
.modal-body{padding:1.2rem}
.modal-footer{padding:.8rem 1.2rem;border-top:1px solid var(--border);display:flex;gap:.6rem;justify-content:flex-end}

/* ── Room availability pills ── */
.avail-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.avail-dot.on{background:#22c55e}
.avail-dot.off{background:#ef4444}

/* ── Alert banner ── */
.alert{padding:.6rem .9rem;border-radius:var(--radius);font-size:.84rem;margin-bottom:.8rem}
.alert-info{background:#dbeafe;color:#1e40af}
.alert-warn{background:#fef9c3;color:#854d0e}
.alert-success{background:#dcfce7;color:#166534}
.alert-danger{background:#fee2e2;color:#991b1b}

/* ── Loader ── */
.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(0,102,51,.25);border-top-color:var(--g);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:4px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Tab bar (marks mgmt) ── */
.tab-bar{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:1rem;flex-wrap:wrap}
.tab-btn{padding:.5rem 1rem;border:none;background:none;cursor:pointer;font-size:.87rem;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;transition:color .15s,border-color .15s}
.tab-btn.active{color:var(--g);border-bottom-color:var(--g);font-weight:700}

/* ── My grades card per course ── */
.course-pill{display:inline-flex;align-items:center;gap:.4rem;background:var(--gl);border:1px solid var(--g);border-radius:6px;padding:.25rem .7rem;font-size:.82rem;color:var(--gd);font-weight:600;margin:.2rem}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════ LOGIN ══ -->
<div id="screen-login" class="auth-wrap">
  <div class="auth-card">
    <div class="auth-header">
      <div style="background:var(--au);width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0">🎓</div>
      <div><h1>SCNRO – PUCIT</h1><p>Smart Campus Navigation &amp; Resource Optimizer</p></div>
    </div>
    <div class="auth-body">
      <form id="login-form" onsubmit="doLogin(event)">
        <label for="li-email">University Email</label>
        <input id="li-email" type="email" placeholder="yourname@pucit.edu.pk" required autocomplete="username"/>
        <label for="li-pass">Password</label>
        <input id="li-pass" type="password" placeholder="••••••••" required autocomplete="current-password"/>
        <div id="login-msg" class="auth-msg"></div>
        <button type="submit" class="btn btn-primary btn-full" id="login-btn">Sign In</button>
      </form>
      <div class="auth-link">Don't have an account? <a onclick="showSignup()">Request Access</a></div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════ SIGNUP ══ -->
<div id="screen-signup" class="auth-wrap" style="display:none">
  <div class="auth-card">
    <div class="auth-header">
      <div style="background:var(--au);width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0">📋</div>
      <div><h1>Request Access</h1><p>Admin approval required before login</p></div>
    </div>
    <div class="auth-body">
      <label for="su-name">Full Name</label>
      <input id="su-name" type="text" placeholder="Your full name" required/>
      <label for="su-email">University Email</label>
      <input id="su-email" type="email" placeholder="yourname@pucit.edu.pk" required/>
      <label for="su-role">Role</label>
      <select id="su-role">
        <option value="student">Student</option>
        <option value="teacher">Teacher / Lecturer</option>
        <option value="sac">SAC Officer</option>
        <option value="head_clerk">Head Clerk</option>
      </select>
      <label for="su-pass">Password</label>
      <input id="su-pass" type="password" placeholder="Min 6 characters" required/>
      <div id="signup-msg" class="auth-msg"></div>
      <button class="btn btn-accent btn-full" onclick="doSignup()">Submit Request</button>
      <div class="auth-link">Already have an account? <a onclick="showLogin()">Sign In</a></div>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════ APP ══ -->
<div id="screen-app" class="app-shell" style="display:none">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo">PU</div>
      <span>SCNRO<br/>PUCIT</span>
    </div>
    <div class="sidebar-user">
      <strong id="sb-name">—</strong>
      <span id="sb-email" style="font-size:.72rem;opacity:.8;display:block"></span>
      <span id="sb-role-badge" class="role-badge">—</span>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <button class="btn btn-sm" onclick="doLogout()">⇠ Sign Out</button>
    </div>
  </aside>

  <!-- Content panes -->
  <div class="main-content" id="main-content">
    <!-- Rendered by JS -->
  </div>
</div>

<!-- ═══════════════════════════════════════════ SHARED MODAL ══ -->
<div id="modal-overlay" class="modal-overlay" style="display:none">
  <div class="modal-box" id="modal-box">
    <div class="modal-header">
      <h3 id="modal-title">Modal</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════ STATE ══════════════════════════════ */
const API = '/api/v1';
let _token = localStorage.getItem('scnro_token') || '';
let _user  = (() => { try{ return JSON.parse(localStorage.getItem('scnro_user')||'null'); }catch(e){return null;} })();

/* ═══════════════════════════════ HELPERS ════════════════════════════ */
async function apiFetch(path, opts={}) {
  const headers = {'Content-Type':'application/json'};
  if (_token) headers['Authorization'] = 'Bearer ' + _token;
  const r = await fetch(API + path, { ...opts, headers });
  if (r.status === 401) { doLogout(); return null; }
  return r;
}
const $id = id => document.getElementById(id);
function showMsg(el, txt, type='error') {
  el.textContent = txt;
  el.className = 'auth-msg ' + type;
}
function openModal(title, bodyHtml, footerHtml='') {
  $id('modal-title').textContent = title;
  $id('modal-body').innerHTML = bodyHtml;
  $id('modal-footer').innerHTML = footerHtml;
  $id('modal-overlay').style.display = 'flex';
}
function closeModal() { $id('modal-overlay').style.display = 'none'; }
$id('modal-overlay').addEventListener('click', e => { if(e.target === $id('modal-overlay')) closeModal(); });

function fmtRole(r) {
  return {admin:'Admin',teacher:'Teacher',student:'Student',sac:'SAC Officer',head_clerk:'Head Clerk'}[r]||r;
}
function badge(txt, cls) { return `<span class="badge ${cls}">${txt}</span>`; }

/* ═══════════════════════════════ AUTH ═══════════════════════════════ */
function showLogin()  { $id('screen-signup').style.display='none'; $id('screen-login').style.display='flex'; }
function showSignup() { $id('screen-login').style.display='none'; $id('screen-signup').style.display='flex'; }

async function doLogin(e) {
  e && e.preventDefault();
  const email = $id('li-email').value.trim();
  const pass  = $id('li-pass').value;
  const msg   = $id('login-msg');
  const btn   = $id('login-btn');
  if (!email || !pass) { showMsg(msg,'Please enter email and password.'); return; }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Signing in…';
  try {
    const r = await fetch(API + '/auth/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, password: pass})
    });
    const data = await r.json();
    if (!r.ok) { showMsg(msg, data.detail || 'Invalid credentials.'); return; }
    _token = data.access_token;
    const me = await (await apiFetch('/auth/me')).json();
    _user = me;
    localStorage.setItem('scnro_token', _token);
    localStorage.setItem('scnro_user', JSON.stringify(_user));
    bootApp();
  } catch(err) {
    showMsg(msg, 'Connection error. Try again.');
  } finally {
    btn.disabled=false; btn.textContent='Sign In';
  }
}

async function doSignup() {
  const name  = $id('su-name').value.trim();
  const email = $id('su-email').value.trim();
  const role  = $id('su-role').value;
  const pass  = $id('su-pass').value;
  const msg   = $id('signup-msg');
  if (!name||!email||!pass) { showMsg(msg,'All fields are required.'); return; }
  if (pass.length < 6)      { showMsg(msg,'Password must be at least 6 characters.'); return; }
  const r = await apiFetch('/auth/signup-request', {
    method:'POST',
    body: JSON.stringify({name,email,password:pass,role_requested:role})
  });
  if (!r) return;
  const data = await r.json();
  if (!r.ok) { showMsg(msg, data.detail || 'Error.'); return; }
  showMsg(msg,'✓ Request submitted! Wait for admin approval.','success');
  setTimeout(showLogin, 2000);
}

function doLogout() {
  _token=''; _user=null;
  localStorage.removeItem('scnro_token');
  localStorage.removeItem('scnro_user');
  document.documentElement.className='guest';
  $id('screen-app').style.display='none';
  $id('screen-login').style.display='flex';
  $id('screen-signup').style.display='none';
}

/* ═══════════════════════════════ NAV ════════════════════════════════ */
const NAV_ALL = [
  {id:'dashboard',  ico:'🏠', lbl:'Dashboard'},
  {id:'free_rooms', ico:'🚪', lbl:'Free Rooms'},
  {id:'navigate',   ico:'🗺', lbl:'Navigate'},
  {id:'lostfound',  ico:'🔍', lbl:'Lost & Found'},
  {id:'faculty',    ico:'👥', lbl:'Faculty',    roles:['admin']},
  {id:'admin_panel',ico:'⚙',  lbl:'Admin Panel', roles:['admin']},
  {id:'marks_mgmt', ico:'��', lbl:'Marks Mgmt',  roles:['teacher','admin']},
  {id:'my_grades',  ico:'🎓', lbl:'My Grades',   roles:['student']},
  {id:'room_mgmt',  ico:'🏢', lbl:'Room Mgmt',   roles:['head_clerk','admin']},
];

let _currentPane = '';

function buildNav() {
  const role = _user.role;
  const nav = $id('sidebar-nav');
  nav.innerHTML = '';
  NAV_ALL.forEach(item => {
    if (item.roles && !item.roles.includes(role)) return;
    const el = document.createElement('div');
    el.className = 'nav-item';
    el.dataset.pane = item.id;
    el.innerHTML = `<span class="ico">${item.ico}</span><span>${item.lbl}</span>`;
    el.addEventListener('click', () => showPane(item.id));
    nav.appendChild(el);
  });
}

function showPane(id) {
  _currentPane = id;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.pane === id);
  });
  const mc = $id('main-content');
  mc.innerHTML = '<div style="text-align:center;padding:2rem"><span class="spinner"></span> Loading…</div>';
  PANES[id] ? PANES[id](mc) : (mc.innerHTML='<p>Pane not found.</p>');
}

/* ═════════════════════════════ BOOT APP ════════════════════════════ */
function bootApp() {
  document.documentElement.className = 'authed';
  $id('screen-login').style.display  = 'none';
  $id('screen-signup').style.display = 'none';
  $id('screen-app').style.display    = 'flex';

  $id('sb-name').textContent  = _user.name;
  $id('sb-email').textContent = _user.email;
  $id('sb-role-badge').textContent = fmtRole(_user.role);

  buildNav();

  // Pick the first pane visible for this role
  const first = NAV_ALL.find(n => !n.roles || n.roles.includes(_user.role));
  if (first) showPane(first.id);
}

/* ═════════════════════════════ PANES ═══════════════════════════════ */
const PANES = {};

/* ── Dashboard ──────────────────────────────────────────────────────── */
PANES.dashboard = async mc => {
  mc.innerHTML = `<h2>�� Dashboard</h2>
  <div class="stat-grid" id="dash-stats"><div class="stat-card"><div class="spinner"></div></div></div>
  <div class="card"><div class="card-title">📢 Welcome to SCNRO</div>
    <p style="font-size:.9rem;color:var(--muted)">Smart Campus Navigation &amp; Resource Optimizer for Punjab University College of Information Technology.</p>
  </div>`;
  try {
    const [locs, items] = await Promise.all([
      apiFetch('/resources/locations').then(r=>r.json()),
      apiFetch('/items').then(r=>r.json()),
    ]);
    const active   = (locs.locations||[]).filter(l=>l.is_active).length;
    const inactive = (locs.locations||[]).length - active;
    const open     = (items.items||[]).filter(i=>i.status!=='Closed').length;
    $id('dash-stats').innerHTML = `
      <div class="stat-card"><div class="val">${(locs.locations||[]).length}</div><div class="lbl">Total Rooms</div></div>
      <div class="stat-card"><div class="val" style="color:#22c55e">${active}</div><div class="lbl">Available</div></div>
      <div class="stat-card"><div class="val" style="color:#ef4444">${inactive}</div><div class="lbl">Unavailable</div></div>

  return (s||'')
    .replace(/&/g,'&amp;')

    .replace(/'/g,'&#x27;');

  if (!payload.name){$id('fac-msg').innerHTML='<div class="alert alert-warn">Name required.</div>';return;}

async function loadCourseMarks(courseId, code, name) {
  const det = $id('mgt-detail');
  det.innerHTML=`<div class="card"><span class="spinner"></span> Loading…</div>`;
  const [studR, marksR, locksR] = await Promise.all([
    apiFetch(`/courses/${courseId}/students`).then(r=>r.json()),
    apiFetch(`/courses/${courseId}/marks`).then(r=>r.json()),
    apiFetch(`/courses/${courseId}/locks`).then(r=>r.json()),
  ]);
  const students = studR.students||[];
  const allMarks = marksR.marks||[];
  const locks    = locksR.locks||{};
  const CATS = ['attendance','quiz','activity','mid','final'];

  function renderCourseDetail() {
    let html = `<div class="card">
      <div class="card-title">📋 ${code} – ${name}</div>
      <div class="tab-bar" id="cat-tabs">
        ${CATS.map((c,i)=>`<button class="tab-btn ${i===0?'active':''}" onclick="switchCat(this,'${c}')">${c.charAt(0).toUpperCase()+c.slice(1)}</button>`).join('')}
      </div>`;
    CATS.forEach((cat,i)=>{
      const isLocked = !!locks[cat];
      const catMarks = allMarks.filter(m=>m.category===cat);
      html += `<div id="cat-pane-${cat}" style="${i>0?'display:none':''}">
        <div style="display:flex;align-items:center;gap:.6rem;margin-bottom:.7rem;flex-wrap:wrap">
          ${isLocked
            ? `<span class="badge badge-gold">🔒 Finalized</span><button class="btn btn-sm btn-ghost" onclick="openMCRModal(${courseId},'${cat}',${JSON.stringify(students).replace(/"/g,'&quot;')})">📩 Request Change</button>`
            : `<button class="btn btn-sm btn-accent" onclick="openAddMarkModal(${courseId},'${cat}',${JSON.stringify(students).replace(/"/g,'&quot;')})">➕ Add Mark</button>
               <button class="btn btn-sm btn-primary" onclick="finalizeCat(${courseId},'${cat}')">🔒 Finalize</button>`
          }
          ${_user.role==='teacher'||_user.role==='admin'?`<button class="btn btn-sm btn-ghost" onclick="downloadPDF(${courseId})">📄 Download PDF</button>`:''}
        </div>
        <div class="tbl-wrap"><table>
          <thead><tr><th>Student</th><th>Title</th><th>Obtained</th><th>Total</th>${isLocked?'':'<th>Actions</th>'}</tr></thead>
          <tbody>
            ${students.map(s=>{
              const m = catMarks.filter(x=>x.student_id===s.student_id);
              if(!m.length) return `<tr><td>${s.name}</td><td colspan="3" style="color:var(--muted)">Not uploaded</td>${isLocked?'':'<td></td>'}</tr>`;
              return m.map(mk=>`<tr>
                <td>${s.name}</td><td>${mk.title}</td>
                <td>${mk.marks_obtained??'—'}</td><td>${mk.total_marks??'—'}</td>
                ${isLocked?'':`<td>
                  <button class="btn btn-sm btn-ghost" onclick="openEditMarkModal(${mk.record_id},'${escHtml(mk.title)}',${mk.marks_obtained??''},${mk.total_marks??''})">Edit</button>
                  <button class="btn btn-sm btn-danger" onclick="deleteMark(${mk.record_id},${courseId},'${code}','${name}')">Del</button>
                </td>`}
              </tr>`).join('');
            }).join('')}
          </tbody>
        </table></div>
      </div>`;
    });
    html += '</div>';
    det.innerHTML = html;
  }
  renderCourseDetail();

  // keep references for reload
  det._reload = () => loadCourseMarks(courseId, code, name);
}

function switchCat(btn,cat){
  btn.closest('.tab-bar').querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  ['attendance','quiz','activity','mid','final'].forEach(c=>{
    const el=$id('cat-pane-'+c);
    if(el) el.style.display = c===cat?'':'none';
  });
}

async function downloadPDF(courseId){
  const token=_token;
  const a=document.createElement('a');
  a.href=`${API}/courses/${courseId}/report.pdf`;
  // Trigger with auth header via fetch + blob
  fetch(a.href,{headers:{'Authorization':'Bearer '+token}})
    .then(r=>{if(!r.ok)throw new Error('PDF error');return r.blob();})
    .then(blob=>{
      const url=URL.createObjectURL(blob);
      const link=document.createElement('a');
      link.href=url; link.download=`course_${courseId}_result.pdf`;
      link.click(); URL.revokeObjectURL(url);
    }).catch(e=>alert('PDF download failed: '+e.message));
}

function openMCRModal(courseId, cat, students){
  openModal(`Request Mark Change — ${cat}`,`
    <div class="alert alert-warn">This category is finalized. You are requesting admin to update a mark.</div>
    <div class="form-field"><label>Student</label>
      <select id="mcr-student" onchange="loadCurrentMark(${courseId},'${cat}')">${students.map(s=>`<option value="${s.student_id}" data-name="${escHtml(s.name)}">${s.name}</option>`).join('')}</select>
    </div>
    <div id="mcr-current-info" class="alert alert-info" style="margin-top:.4rem">Select a student to see current mark.</div>
    <div class="form-field" style="margin-top:.5rem"><label>Record to Change</label>
      <select id="mcr-record"><option value="">— select after loading —</option></select>
    </div>
    <div class="form-field"><label>New Marks Obtained *</label><input id="mcr-new-obt" type="number" step="0.01"/></div>
    <div class="form-field"><label>New Total Marks (optional)</label><input id="mcr-new-tot" type="number" step="0.01"/></div>
    <div class="form-field"><label>Reason *</label><textarea id="mcr-reason" rows="3" placeholder="Explain why marks should change…"></textarea></div>`,
    `<button class="btn btn-accent btn-sm" onclick="submitMCR(${courseId},'${cat}')">📩 Send Request</button>
     <button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancel</button>`
  );
  loadCurrentMark(courseId, cat);
}
async function loadCurrentMark(courseId, cat){
  const studId = $id('mcr-student').value;
  const infoEl = $id('mcr-current-info');
  const recEl  = $id('mcr-record');
  if(!infoEl||!recEl) return;
  infoEl.textContent='Loading…';
  const r = await apiFetch(`/courses/${courseId}/marks`);
  const d = await r.json();
  const recs = (d.marks||[]).filter(m=>m.student_id===parseInt(studId)&&m.category===cat);
  if(!recs.length){ infoEl.textContent='No marks in this category for selected student.'; recEl.innerHTML='<option>No records</option>'; return; }
  recEl.innerHTML = recs.map(m=>`<option value="${m.record_id}">${m.title}: ${m.marks_obtained??'–'}/${m.total_marks??'–'}</option>`).join('');
  const first=recs[0];
  infoEl.innerHTML=`Current: <b>${first.title}</b> — ${first.marks_obtained??'–'} / ${first.total_marks??'–'}`;
  $id('mcr-new-obt').value = first.marks_obtained??'';
  $id('mcr-new-tot').value = first.total_marks??'';
}
async function submitMCR(courseId,cat){
  const recId  = parseInt($id('mcr-record').value);
  const newObt = parseFloat($id('mcr-new-obt').value);
  const newTot = $id('mcr-new-tot').value ? parseFloat($id('mcr-new-tot').value) : null;
  const reason = $id('mcr-reason').value.trim();
  if(!recId||isNaN(newObt)||!reason){alert('Fill all required fields.');return;}
  const payload={record_id:recId,new_marks_obtained:newObt,reason};
  if(newTot!==null) payload.new_total_marks=newTot;
  const r=await apiFetch('/marks/change-request',{method:'POST',body:JSON.stringify(payload)});
  const d=await r.json();
  if(!r.ok){alert(d.detail);return;}
  closeModal();
  alert('✓ Change request sent to admin.');
}

    end_time:$id('ns-end').value,
    section:$id('ns-sec').value.trim()||null,
    notes:$id('ns-notes').value.trim()||null,
  };
  if(!payload.course_code||!payload.start_time||!payload.end_time){alert('Fill required fields.');return;}
  const r=await apiFetch('/clerk/schedules',{method:'POST',body:JSON.stringify(payload)});
  if(!r.ok){alert((await r.json()).detail);return;}
  closeModal(); loadSchedules();
}
function openEditScheduleModal(id,locId,code,day,start,end,sec,notes){
  openModal('Edit Schedule',`
    <div class="form-field"><label>Room</label>${roomDropdown('es-room')}</div>
    <div class="form-field"><label>Course Code</label><input id="es-code" value="${escHtml(code)}"/></div>
    <div class="form-field"><label>Section</label><input id="es-sec" value="${escHtml(sec)}"/></div>
    <div class="form-field"><label>Day</label>${dayDropdown('es-day',day)}</div>
    <div class="form-field"><label>Start Time</label><input id="es-start" type="time" value="${(start||'').substring(0,5)}"/></div>
    <div class="form-field"><label>End Time</label><input id="es-end" type="time" value="${(end||'').substring(0,5)}"/></div>
    <div class="form-field"><label>Notes</label><input id="es-notes" value="${escHtml(notes)}"/></div>`,
    `<button class="btn btn-primary btn-sm" onclick="saveSchedule(${id})">Save</button>
     <button class="btn btn-ghost btn-sm"   onclick="closeModal()">Cancel</button>`
  );
  // Pre-select current room
  setTimeout(()=>{ const s=$id('es-room'); if(s){[...s.options].forEach(o=>{if(parseInt(o.value)===locId)o.selected=true;});} },50);
}
async function saveSchedule(id){
  const payload={
    location_id:parseInt($id('es-room').value),
    course_code:$id('es-code').value.trim()||undefined,
    day_of_week:parseInt($id('es-day').value),
    start_time:$id('es-start').value||undefined,
    end_time:$id('es-end').value||undefined,
    section:$id('es-sec').value.trim()||undefined,
    notes:$id('es-notes').value.trim()||undefined,
  };
  const r=await apiFetch(`/clerk/schedules/${id}`,{method:'PUT',body:JSON.stringify(payload)});
  if(!r.ok){alert((await r.json()).detail);return;}
  closeModal(); loadSchedules();
}
async function deleteSchedule(id){
  if(!confirm('Delete this schedule?'))return;
  const r=await apiFetch(`/clerk/schedules/${id}`,{method:'DELETE'});
  if(!r.ok){alert((await r.json()).detail);return;}
  loadSchedules();
}

  if(_token && _user){
    bootApp();
  } else {
    $id('screen-login').style.display='flex';
  }
})();
